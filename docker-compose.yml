# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY — Production is deployed on Vercel (see vercel.json).
# Start local dev environment: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: $${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: $${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: $${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: $${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: $${POSTGRES_DB:-slotify}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
