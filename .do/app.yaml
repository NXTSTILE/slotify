name: slotify-app
services:
  - name: slotify-web
    github:
      repo: 240301370033-eng/nxtstile-wp
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_VERIFY_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_APP_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_API_VERSION
        scope: RUN_TIME
        value: "v19.0"
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET
jobs:
  - name: reminders-cron
    kind: SCHEDULED
    schedule: "*/30 * * * *"
    image:
      registry_type: DOCKER_HUB
      registry: curlimages
      repository: curl
      tag: latest
    run_command: curl -s -X GET -H "Authorization: Bearer $${CRON_SECRET}" https://$${APP_URL}/api/cron/reminders
    envs:
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET
